name: CodeMender + Gemma 4 Security CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: CodeMender SAST + Gemma 4 Remediation Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CodeMender + Gemma 4 Security Guard
        run: |
          python3 codemender_gemma4_security_guard/codemender_gemma4_pipeline.py .
