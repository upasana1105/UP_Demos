[project]
name = "employee-verification-agent"
version = "0.1.0"
description = "Employee Verification agent using A2UI, A2A, and ADK on Agent Engine. Extensible multi-agent architecture with BigQuery backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.4,<1.0.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.128.0",
    "a2ui-agent-sdk>=0.1.2",
    "google-cloud-bigquery>=3.20.0",
    "python-dotenv>=1.1.0",
]
