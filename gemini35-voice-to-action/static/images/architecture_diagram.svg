<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11" />
      <stop offset="50%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#090C13" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151C2C" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F1523" stop-opacity="0.98" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowFuchsia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #FFFFFF; }
    .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #94A3B8; }
    .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #FFFFFF; font-size: 15px; }
    .model-tag { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: 600; }
    .body-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #CBD5E1; line-height: 1.5; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1240" height="700" fill="url(#bgGrad)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="100" r="160" fill="#06B6D4" opacity="0.08" filter="url(#glowCyan)" />
  <circle cx="1100" cy="600" r="200" fill="#D946EF" opacity="0.07" filter="url(#glowFuchsia)" />
  <circle cx="620" cy="350" r="260" fill="#6366F1" opacity="0.05" filter="url(#glowCyan)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.05" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="120" x2="1240" y2="120" />
    <line x1="0" y1="560" x2="1240" y2="560" />
    <line x1="310" y1="120" x2="310" y2="560" />
    <line x1="620" y1="120" x2="620" y2="560" />
    <line x1="930" y1="120" x2="930" y2="560" />
  </g>

  <!-- Top Header Section -->
  <g transform="translate(50, 40)">
    <!-- Header Tag -->
    <rect x="0" y="0" width="170" height="24" rx="12" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.3" />
    <text x="85" y="16" text-anchor="middle" class="badge-text" fill="#38BDF8">PIPELINE ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="55" class="title" font-size="26">Voice Canvas Studio</text>
    <rect x="270" y="36" width="165" height="24" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="352" y="52" text-anchor="middle" class="badge-text" fill="#94A3B8">GOOGLE CLOUD VERTEX AI</text>

    <text x="0" y="80" class="subtitle" font-size="13">Acoustic Speech ➔ Multilingual ASR ➔ Conversational In-Painting ➔ Temporal Video with Native 48kHz Stereo Audio</text>

    <!-- Status Badges -->
    <g transform="translate(850, 20)">
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#0F172A" stroke="#1E293B" />
      <circle cx="16" cy="16" r="4" fill="#10B981" />
      <text x="28" y="20" class="badge-text" fill="#E2E8F0">100% Voice-Driven</text>

      <rect x="140" y="0" width="150" height="32" rx="8" fill="#0F172A" stroke="#1E293B" />
      <circle cx="156" cy="16" r="4" fill="#38BDF8" />
      <text x="168" y="20" class="badge-text" fill="#E2E8F0">Auth: Cloud ADC</text>
    </g>
  </g>

  <!-- ================= 4 PIPELINE CARDS ================= -->

  <!-- CARD 1: Acoustic Ingestion -->
  <g transform="translate(50, 150)" filter="url(#dropShadow)">
    <rect width="260" height="380" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#06B6D4" />
    
    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.4" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#22D3EE">STAGE 01</text>
    
    <text x="225" y="34" font-size="18">🎙️</text>

    <text x="18" y="68" class="card-title">Acoustic Ingestion</text>
    <text x="18" y="88" class="model-tag" fill="#38BDF8">gemini-3.5-transcribe</text>

    <line x1="18" y1="102" x2="242" y2="102" stroke="#1E293B" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="2.5" fill="#22D3EE" />
      <text x="14" y="10" class="body-text">Web Audio API streams PCM</text>
      <text x="14" y="26" class="body-text">audio with zero text bottleneck</text>

      <circle cx="4" cy="52" r="2.5" fill="#22D3EE" />
      <text x="14" y="56" class="body-text">Native Multilingual ASR:</text>
      <text x="14" y="72" class="body-text" fill="#38BDF8">Devanagari Hindi (<tspan fill="#F59E0B">फूलदान</tspan>)</text>
      <text x="14" y="88" class="body-text">&amp; English transcription</text>

      <circle cx="4" cy="114" r="2.5" fill="#22D3EE" />
      <text x="14" y="118" class="body-text">Code-switched Hinglish</text>
      <text x="14" y="134" class="body-text">pacing &amp; tone preservation</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="224" height="36" rx="8" fill="#090D16" stroke="#1E293B" />
    <text x="30" y="347" class="badge-text" fill="#64748B">LATENCY</text>
    <text x="230" y="347" text-anchor="end" class="badge-text" fill="#22D3EE">&lt; 380ms TTFT</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 315 340 L 350 340" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <!-- CARD 2: Intent Router -->
  <g transform="translate(355, 150)" filter="url(#dropShadow)">
    <rect width="260" height="380" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#6366F1" />

    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.4" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#818CF8">STAGE 02</text>
    
    <text x="225" y="34" font-size="18">🧠</text>

    <text x="18" y="68" class="card-title">Intent &amp; Tool Router</text>
    <text x="18" y="88" class="model-tag" fill="#818CF8">gemini-3.7-flash (Tools)</text>

    <line x1="18" y1="102" x2="242" y2="102" stroke="#1E293B" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="2.5" fill="#818CF8" />
      <text x="14" y="10" class="body-text">In-flight semantic routing into</text>
      <text x="14" y="26" class="body-text">structured function schemas:</text>

      <!-- Code Chips -->
      <rect x="14" y="40" width="210" height="22" rx="4" fill="#1E1B4B" stroke="#3730A3" />
      <text x="22" y="55" class="model-tag" fill="#A5B4FC">• draw_picture(prompt)</text>

      <rect x="14" y="68" width="210" height="22" rx="4" fill="#1E1B4B" stroke="#3730A3" />
      <text x="22" y="83" class="model-tag" fill="#A5B4FC">• edit_current_image(delta)</text>

      <rect x="14" y="96" width="210" height="22" rx="4" fill="#1E1B4B" stroke="#3730A3" />
      <text x="22" y="111" class="model-tag" fill="#A5B4FC">• animate_artwork(motion)</text>

      <circle cx="4" cy="140" r="2.5" fill="#818CF8" />
      <text x="14" y="144" class="body-text">Zero prompt engineering required</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="224" height="36" rx="8" fill="#090D16" stroke="#1E293B" />
    <text x="30" y="347" class="badge-text" fill="#64748B">ROUTING</text>
    <text x="230" y="347" text-anchor="end" class="badge-text" fill="#818CF8">Single Forward Pass</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 620 340 L 655 340" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <!-- CARD 3: Visual Sculpting -->
  <g transform="translate(660, 150)" filter="url(#dropShadow)">
    <rect width="260" height="380" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#F59E0B" />

    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#FBBF24">STAGE 03</text>
    
    <text x="225" y="34" font-size="18">🎨</text>

    <text x="18" y="68" class="card-title">Visual In-Painting</text>
    <text x="18" y="88" class="model-tag" fill="#FBBF24">gemini-3.1-flash-image</text>

    <line x1="18" y1="102" x2="242" y2="102" stroke="#1E293B" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="2.5" fill="#FBBF24" />
      <text x="14" y="10" class="body-text">16:9 Widescreen image synthesis</text>
      <text x="14" y="26" class="body-text">aligned to canvas viewport</text>

      <circle cx="4" cy="52" r="2.5" fill="#FBBF24" />
      <text x="14" y="56" class="body-text"><tspan font-weight="600" fill="#FFFFFF">Conversational In-Painting:</tspan></text>
      <text x="14" y="72" class="body-text">Passes active canvas pixels +</text>
      <text x="14" y="88" class="body-text">spoken delta instructions</text>

      <circle cx="4" cy="114" r="2.5" fill="#FBBF24" />
      <text x="14" y="118" class="body-text">Preserves character identity,</text>
      <text x="14" y="134" class="body-text">lighting, and composition</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="224" height="36" rx="8" fill="#090D16" stroke="#1E293B" />
    <text x="30" y="347" class="badge-text" fill="#64748B">ASPECT RATIO</text>
    <text x="230" y="347" text-anchor="end" class="badge-text" fill="#FBBF24">16:9 Cinema</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 925 340 L 960 340" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowAmber)" />

  <!-- CARD 4: Temporal Video & Native Audio -->
  <g transform="translate(965, 150)" filter="url(#dropShadow)">
    <rect width="225" height="380" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="225" height="4" rx="2" fill="#D946EF" />

    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#D946EF" fill-opacity="0.15" stroke="#D946EF" stroke-opacity="0.4" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#E879F9">STAGE 04</text>
    
    <text x="190" y="34" font-size="18">🎬</text>

    <text x="18" y="68" class="card-title">Video &amp; Sound</text>
    <text x="18" y="88" class="model-tag" fill="#E879F9">gemini-omni-flash</text>

    <line x1="18" y1="102" x2="207" y2="102" stroke="#1E293B" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="2.5" fill="#E879F9" />
      <text x="14" y="10" class="body-text">Image-to-Video 720p 24fps</text>
      <text x="14" y="26" class="body-text">physical temporal simulation</text>

      <circle cx="4" cy="52" r="2.5" fill="#E879F9" />
      <text x="14" y="56" class="body-text"><tspan font-weight="600" fill="#FFFFFF">Native Audio Synthesis:</tspan></text>
      <text x="14" y="72" class="body-text">48kHz stereo AAC sound</text>
      <text x="14" y="88" class="body-text">synced to water/wind motion</text>

      <circle cx="4" cy="114" r="2.5" fill="#E879F9" />
      <text x="14" y="118" class="body-text"><tspan font-weight="600" fill="#FFFFFF">FFmpeg Mastering:</tspan> +8dB</text>
      <text x="14" y="134" class="body-text">to -13 LUFS broadcast audio</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="189" height="36" rx="8" fill="#090D16" stroke="#1E293B" />
    <text x="28" y="347" class="badge-text" fill="#64748B">OUTPUT</text>
    <text x="195" y="347" text-anchor="end" class="badge-text" fill="#E879F9">720p · 48kHz</text>
  </g>

  <!-- ================= BOTTOM DATA FLOW BAR ================= -->
  <g transform="translate(50, 560)">
    <rect width="1140" height="90" rx="14" fill="#0D1322" stroke="#1E293B" stroke-width="1.5" />

    <circle cx="30" cy="45" r="5" fill="#10B981" />
    
    <text x="45" y="38" class="badge-text" fill="#64748B">CLOSED-LOOP MULTIMODAL DIRECTING CYCLE</text>
    <text x="45" y="60" class="body-text" font-size="13">
      Microphone ➔ <tspan fill="#38BDF8" font-weight="600">Acoustic ASR</tspan> ➔ <tspan fill="#818CF8" font-weight="600">Tool Calling</tspan> ➔ <tspan fill="#FBBF24" font-weight="600">In-Painting</tspan> ➔ <tspan fill="#E879F9" font-weight="600">Temporal Video &amp; Native Sound</tspan> ➔ <tspan fill="#34D399" font-weight="600">Unmuted Playback</tspan>
    </text>

    <!-- Right Badges -->
    <g transform="translate(910, 28)">
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#151E32" stroke="#253350" />
      <text x="52" y="21" text-anchor="middle" class="badge-text" fill="#38BDF8">ADC AUTH</text>

      <rect x="115" y="0" width="100" height="34" rx="8" fill="#151E32" stroke="#253350" />
      <text x="165" y="21" text-anchor="middle" class="badge-text" fill="#E879F9">GLOBAL REGION</text>
    </g>
  </g>

</svg>
