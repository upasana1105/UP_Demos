<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700">
  <defs>
    <!-- Warm Light Cream / Linen Background -->
    <linearGradient id="warmLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="50%" stop-color="#F7F3EE" />
      <stop offset="100%" stop-color="#F3ECE4" />
    </linearGradient>

    <!-- Warm White Card Surface -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFCFA" />
    </linearGradient>

    <!-- Soft Editorial Warm Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#78350F" flood-opacity="0.08" />
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04" />
    </filter>

    <!-- Warm Arrow Markers -->
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D97706" />
    </marker>
    <marker id="arrowTerracotta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EA580C" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#E11D48" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #1C1917; }
    .subtitle { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #57534E; }
    .card-title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #1C1917; font-size: 14.5px; }
    .model-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
    .body-text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #44403C; line-height: 1.55; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background Canvas -->
  <rect width="1240" height="700" fill="url(#warmLightBg)" />

  <!-- Subtle Warm Radial Atmosphere -->
  <circle cx="180" cy="120" r="220" fill="#FEF3C7" opacity="0.6" />
  <circle cx="1080" cy="560" r="260" fill="#FFE4E6" opacity="0.6" />
  <circle cx="620" cy="340" r="300" fill="#FFEDD5" opacity="0.4" />

  <!-- Editorial Grid Lines -->
  <g opacity="0.35" stroke="#E7DDD6" stroke-width="1">
    <line x1="0" y1="120" x2="1240" y2="120" />
    <line x1="0" y1="560" x2="1240" y2="560" />
    <line x1="310" y1="120" x2="310" y2="560" stroke-dasharray="3 3" />
    <line x1="620" y1="120" x2="620" y2="560" stroke-dasharray="3 3" />
    <line x1="930" y1="120" x2="930" y2="560" stroke-dasharray="3 3" />
  </g>

  <!-- Top Header Section -->
  <g transform="translate(50, 40)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#FEF3C7" stroke="#FDE68A" />
    <text x="90" y="16" text-anchor="middle" class="badge-text" fill="#B45309">PIPELINE ARCHITECTURE</text>

    <!-- Title -->
    <text x="0" y="55" class="title" font-size="26">Voice Canvas Studio</text>
    
    <!-- Omni 1.1 Flash Hero Tag -->
    <rect x="275" y="36" width="175" height="25" rx="6" fill="#FFE4E6" stroke="#FDA4AF" />
    <text x="362" y="53" text-anchor="middle" class="badge-text" fill="#BE123C">✨ OMNI 1.1 FLASH</text>

    <text x="0" y="80" class="subtitle" font-size="13">Real-Time Multilingual Transcription ➔ 3.7 Flash Tool Calling ➔ Conversational In-Painting ➔ Omni 1.1 Flash Video &amp; Sound</text>

    <!-- Top Right Meta Badges -->
    <g transform="translate(835, 20)">
      <rect x="0" y="0" width="140" height="32" rx="8" fill="#FFFFFF" stroke="#E7DDD6" filter="url(#badgeShadow)" />
      <circle cx="16" cy="16" r="4" fill="#D97706" />
      <text x="28" y="20" class="badge-text" fill="#1C1917">100% Voice-Driven</text>

      <rect x="150" y="0" width="155" height="32" rx="8" fill="#FFFFFF" stroke="#E7DDD6" filter="url(#badgeShadow)" />
      <circle cx="166" cy="16" r="4" fill="#E11D48" />
      <text x="178" y="20" class="badge-text" fill="#1C1917">Vertex AI Global (ADC)</text>
    </g>
  </g>

  <!-- ================= 4 PIPELINE CARDS ================= -->

  <!-- CARD 1: Real-Time Multilingual Transcription (Golden Honey) -->
  <g transform="translate(50, 150)" filter="url(#softShadow)">
    <rect width="260" height="380" rx="18" fill="url(#cardSurface)" stroke="#E7DDD6" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="5" rx="2.5" fill="#D97706" />
    
    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#FEF3C7" stroke="#FDE68A" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#B45309">STAGE 01</text>
    
    <text x="225" y="35" font-size="18">🎙️</text>

    <text x="18" y="68" class="card-title">Real-Time Transcription</text>
    <text x="18" y="88" class="model-tag" fill="#B45309">gemini-3.5-transcribe</text>

    <line x1="18" y1="102" x2="242" y2="102" stroke="#F0E8E2" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="3" fill="#D97706" />
      <text x="14" y="10" class="body-text"><tspan font-weight="700" fill="#1C1917">Multilingual Speech Ingestion:</tspan></text>
      <text x="14" y="26" class="body-text">Streams raw audio chunks with</text>
      <text x="14" y="42" class="body-text">zero text-prompt bottleneck</text>

      <circle cx="4" cy="68" r="3" fill="#D97706" />
      <text x="14" y="72" class="body-text"><tspan font-weight="700" fill="#1C1917">Low-Latency Acoustic ASR:</tspan></text>
      <text x="14" y="88" class="body-text">Transcribes multilingual speech</text>
      <text x="14" y="104" class="body-text">in real time directly from mic</text>

      <circle cx="4" cy="130" r="3" fill="#D97706" />
      <text x="14" y="134" class="body-text">Preserves speech rhythm,</text>
      <text x="14" y="150" class="body-text">pacing, tone &amp; creative intent</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="224" height="36" rx="8" fill="#FFFBEB" stroke="#FDE68A" />
    <text x="30" y="347" class="badge-text" fill="#78716C">LATENCY</text>
    <text x="230" y="347" text-anchor="end" class="badge-text" fill="#B45309">&lt; 380ms TTFT</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 315 340 L 350 340" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowAmber)" />

  <!-- CARD 2: Tool Calling / Function Calling with 3.7 Flash (Warm Terracotta) -->
  <g transform="translate(355, 150)" filter="url(#softShadow)">
    <rect width="260" height="380" rx="18" fill="url(#cardSurface)" stroke="#E7DDD6" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="5" rx="2.5" fill="#EA580C" />

    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#FFEDD5" stroke="#FED7AA" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#C2410C">STAGE 02</text>
    
    <text x="225" y="35" font-size="18">🧠</text>

    <text x="18" y="68" class="card-title">Tool / Function Calling</text>
    <text x="18" y="88" class="model-tag" fill="#C2410C">gemini-3.7-flash (Tools)</text>

    <line x1="18" y1="102" x2="242" y2="102" stroke="#F0E8E2" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="3" fill="#EA580C" />
      <text x="14" y="10" class="body-text"><tspan font-weight="700" fill="#1C1917">In-Flight Function Calling:</tspan></text>
      <text x="14" y="26" class="body-text">Classifies intent into structured</text>
      <text x="14" y="42" class="body-text">tool schemas in a single pass:</text>

      <!-- Code Chips -->
      <rect x="14" y="52" width="210" height="22" rx="4" fill="#FFF7ED" stroke="#FED7AA" />
      <text x="22" y="67" class="model-tag" fill="#9A3412">• draw_picture(prompt)</text>

      <rect x="14" y="78" width="210" height="22" rx="4" fill="#FFF7ED" stroke="#FED7AA" />
      <text x="22" y="93" class="model-tag" fill="#9A3412">• edit_current_image(delta)</text>

      <rect x="14" y="104" width="210" height="22" rx="4" fill="#FFF7ED" stroke="#FED7AA" />
      <text x="22" y="119" class="model-tag" fill="#9A3412">• animate_artwork(motion)</text>

      <circle cx="4" cy="144" r="3" fill="#EA580C" />
      <text x="14" y="148" class="body-text">Zero complex prompt chains</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="224" height="36" rx="8" fill="#FFF7ED" stroke="#FED7AA" />
    <text x="30" y="347" class="badge-text" fill="#78716C">ROUTING</text>
    <text x="230" y="347" text-anchor="end" class="badge-text" fill="#C2410C">3.7 Flash Sub-Second</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 620 340 L 655 340" stroke="#EA580C" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowTerracotta)" />

  <!-- CARD 3: Visual Sculpting (Coral Carmine) -->
  <g transform="translate(660, 150)" filter="url(#softShadow)">
    <rect width="260" height="380" rx="18" fill="url(#cardSurface)" stroke="#E7DDD6" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="5" rx="2.5" fill="#E11D48" />

    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#FFE4E6" stroke="#FECDD3" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#BE123C">STAGE 03</text>
    
    <text x="225" y="35" font-size="18">🎨</text>

    <text x="18" y="68" class="card-title">Visual In-Painting</text>
    <text x="18" y="88" class="model-tag" fill="#BE123C">gemini-3.1-flash-image</text>

    <line x1="18" y1="102" x2="242" y2="102" stroke="#F0E8E2" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="3" fill="#E11D48" />
      <text x="14" y="10" class="body-text">16:9 Widescreen canvas image</text>
      <text x="14" y="26" class="body-text">generation aligned to viewport</text>

      <circle cx="4" cy="52" r="3" fill="#E11D48" />
      <text x="14" y="56" class="body-text"><tspan font-weight="700" fill="#1C1917">Conversational In-Painting:</tspan></text>
      <text x="14" y="72" class="body-text">Passes active canvas pixels +</text>
      <text x="14" y="88" class="body-text">spoken delta instructions</text>

      <circle cx="4" cy="114" r="3" fill="#E11D48" />
      <text x="14" y="118" class="body-text">Preserves character identity,</text>
      <text x="14" y="134" class="body-text">scene lighting, and environment</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="224" height="36" rx="8" fill="#FFF1F2" stroke="#FECDD3" />
    <text x="30" y="347" class="badge-text" fill="#78716C">CANVAS</text>
    <text x="230" y="347" text-anchor="end" class="badge-text" fill="#BE123C">16:9 Cinema</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 925 340 L 960 340" stroke="#E11D48" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowRose)" />

  <!-- CARD 4: Omni 1.1 Flash Video & Native Audio (Sunset Wine) -->
  <g transform="translate(965, 150)" filter="url(#softShadow)">
    <rect width="225" height="380" rx="18" fill="url(#cardSurface)" stroke="#FDA4AF" stroke-width="1.8" />
    <rect x="0" y="0" width="225" height="5" rx="2.5" fill="#9F1239" />

    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#FCE7F3" stroke="#FBCFE8" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#9D174D">STAGE 04</text>
    
    <text x="190" y="35" font-size="18">✨</text>

    <text x="18" y="68" class="card-title">Video &amp; Sound</text>
    <text x="18" y="88" class="model-tag" fill="#9F1239">Omni 1.1 Flash</text>

    <line x1="18" y1="102" x2="207" y2="102" stroke="#F0E8E2" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="3" fill="#9F1239" />
      <text x="14" y="10" class="body-text"><tspan font-weight="700" fill="#1C1917">Gemini Omni 1.1 Flash:</tspan></text>
      <text x="14" y="26" class="body-text">720p 24fps physical simulation</text>

      <circle cx="4" cy="52" r="3" fill="#9F1239" />
      <text x="14" y="56" class="body-text"><tspan font-weight="700" fill="#1C1917">Native Audio Synthesis:</tspan></text>
      <text x="14" y="72" class="body-text">48kHz stereo AAC sound</text>
      <text x="14" y="88" class="body-text">synchronized to visual motion</text>

      <circle cx="4" cy="114" r="3" fill="#9F1239" />
      <text x="14" y="118" class="body-text"><tspan font-weight="700" fill="#1C1917">FFmpeg Mastering:</tspan> +8dB</text>
      <text x="14" y="134" class="body-text">to -13 LUFS broadcast audio</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="189" height="36" rx="8" fill="#FDF2F8" stroke="#FBCFE8" />
    <text x="28" y="347" class="badge-text" fill="#78716C">OUTPUT</text>
    <text x="195" y="347" text-anchor="end" class="badge-text" fill="#9F1239">720p · 48kHz</text>
  </g>

  <!-- ================= BOTTOM DATA FLOW BAR ================= -->
  <g transform="translate(50, 560)">
    <rect width="1140" height="90" rx="16" fill="#FFFFFF" stroke="#E7DDD6" stroke-width="1.5" filter="url(#softShadow)" />

    <circle cx="30" cy="45" r="5" fill="#D97706" />
    
    <text x="45" y="38" class="badge-text" fill="#78716C">CLOSED-LOOP MULTIMODAL DIRECTING CYCLE</text>
    <text x="45" y="60" class="body-text" font-size="13">
      Microphone ➔ <tspan fill="#B45309" font-weight="700">Real-Time Multilingual Transcription</tspan> ➔ <tspan fill="#C2410C" font-weight="700">3.7 Flash Tool Calling</tspan> ➔ <tspan fill="#BE123C" font-weight="700">3.1 Flash In-Painting</tspan> ➔ <tspan fill="#9F1239" font-weight="800">Omni 1.1 Flash (Video + Sound)</tspan> ➔ <tspan fill="#B45309" font-weight="700">Unmuted Playback</tspan>
    </text>

    <!-- Right Badges -->
    <g transform="translate(900, 28)">
      <rect x="0" y="0" width="110" height="34" rx="8" fill="#FEF3C7" stroke="#FDE68A" />
      <text x="55" y="21" text-anchor="middle" class="badge-text" fill="#B45309">ADC AUTH</text>

      <rect x="120" y="0" width="110" height="34" rx="8" fill="#FFE4E6" stroke="#FECDD3" />
      <text x="175" y="21" text-anchor="middle" class="badge-text" fill="#BE123C">OMNI 1.1 FLASH</text>
    </g>
  </g>

</svg>
