<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700">
  <defs>
    <!-- Warm Background Gradient -->
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140D0A" />
      <stop offset="50%" stop-color="#1A120E" />
      <stop offset="100%" stop-color="#0F0907" />
    </linearGradient>

    <!-- Warm Card Background -->
    <linearGradient id="warmCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231813" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#18110D" stop-opacity="0.98" />
    </linearGradient>

    <!-- Warm Ambient Glow Filters -->
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Warm Arrow Markers -->
    <marker id="arrowWarm" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FB7185" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #FFFBEB; }
    .subtitle { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #D6D3D1; }
    .card-title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #FFFBEB; font-size: 15px; }
    .model-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .body-text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #E7E5E4; line-height: 1.5; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1240" height="700" fill="url(#warmBg)" />

  <!-- Warm Ambient Glow Blobs -->
  <circle cx="160" cy="110" r="180" fill="#D97706" opacity="0.12" filter="url(#glowAmber)" />
  <circle cx="1100" cy="580" r="220" fill="#E11D48" opacity="0.10" filter="url(#glowRose)" />
  <circle cx="650" cy="350" r="280" fill="#EA580C" opacity="0.08" filter="url(#glowAmber)" />

  <!-- Subtle Blueprint Grid in Warm Tone -->
  <g opacity="0.04" stroke="#F59E0B" stroke-width="1">
    <line x1="0" y1="120" x2="1240" y2="120" />
    <line x1="0" y1="560" x2="1240" y2="560" />
    <line x1="310" y1="120" x2="310" y2="560" />
    <line x1="620" y1="120" x2="620" y2="560" />
    <line x1="930" y1="120" x2="930" y2="560" />
  </g>

  <!-- Top Header Section -->
  <g transform="translate(50, 40)">
    <!-- Warm Tag -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-opacity="0.4" />
    <text x="90" y="16" text-anchor="middle" class="badge-text" fill="#FBBF24">PIPELINE ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="55" class="title" font-size="26">Voice Canvas Studio</text>
    <rect x="275" y="36" width="175" height="25" rx="6" fill="#881337" fill-opacity="0.6" stroke="#BE123C" stroke-opacity="0.8" />
    <text x="362" y="53" text-anchor="middle" class="badge-text" fill="#FECDD3">✨ OMNI 1.1 FLASH</text>

    <text x="0" y="80" class="subtitle" font-size="13">Acoustic Speech ➔ Multilingual ASR ➔ Conversational In-Painting ➔ Temporal Video &amp; Native Audio with Gemini Omni 1.1 Flash</text>

    <!-- Status Badges -->
    <g transform="translate(840, 20)">
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#1C1410" stroke="#3E2C22" />
      <circle cx="16" cy="16" r="4" fill="#F59E0B" />
      <text x="28" y="20" class="badge-text" fill="#FFFBEB">100% Voice-Driven</text>

      <rect x="145" y="0" width="155" height="32" rx="8" fill="#1C1410" stroke="#3E2C22" />
      <circle cx="161" cy="16" r="4" fill="#FB7185" />
      <text x="173" y="20" class="badge-text" fill="#FFFBEB">Vertex AI Global (ADC)</text>
    </g>
  </g>

  <!-- ================= 4 PIPELINE CARDS ================= -->

  <!-- CARD 1: Acoustic Ingestion (Amber Gold) -->
  <g transform="translate(50, 150)" filter="url(#dropShadow)">
    <rect width="260" height="380" rx="18" fill="url(#warmCardBg)" stroke="#3E2C22" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="5" rx="2.5" fill="#F59E0B" />
    
    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-opacity="0.5" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#FBBF24">STAGE 01</text>
    
    <text x="225" y="34" font-size="18">🎙️</text>

    <text x="18" y="68" class="card-title">Acoustic Ingestion</text>
    <text x="18" y="88" class="model-tag" fill="#FBBF24">gemini-3.5-transcribe</text>

    <line x1="18" y1="102" x2="242" y2="102" stroke="#3E2C22" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="3" fill="#F59E0B" />
      <text x="14" y="10" class="body-text">Web Audio API streams PCM</text>
      <text x="14" y="26" class="body-text">audio with zero text bottleneck</text>

      <circle cx="4" cy="52" r="3" fill="#F59E0B" />
      <text x="14" y="56" class="body-text">Native Multilingual ASR:</text>
      <text x="14" y="72" class="body-text" fill="#FBBF24">Devanagari Hindi (<tspan fill="#FDE68A">फूलदान</tspan>)</text>
      <text x="14" y="88" class="body-text">&amp; English speech transcription</text>

      <circle cx="4" cy="114" r="3" fill="#F59E0B" />
      <text x="14" y="118" class="body-text">Code-switched Hinglish</text>
      <text x="14" y="134" class="body-text">speech pacing &amp; tone preserved</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="224" height="36" rx="8" fill="#140E0A" stroke="#3E2C22" />
    <text x="30" y="347" class="badge-text" fill="#A8A29E">LATENCY</text>
    <text x="230" y="347" text-anchor="end" class="badge-text" fill="#FBBF24">&lt; 380ms TTFT</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 315 340 L 350 340" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowWarm)" />

  <!-- CARD 2: Intent Router (Terracotta Orange) -->
  <g transform="translate(355, 150)" filter="url(#dropShadow)">
    <rect width="260" height="380" rx="18" fill="url(#warmCardBg)" stroke="#3E2C22" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="5" rx="2.5" fill="#FB923C" />

    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#FB923C" fill-opacity="0.2" stroke="#FB923C" stroke-opacity="0.5" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#FDBA74">STAGE 02</text>
    
    <text x="225" y="34" font-size="18">🧠</text>

    <text x="18" y="68" class="card-title">Intent &amp; Tool Router</text>
    <text x="18" y="88" class="model-tag" fill="#FDBA74">gemini-3.7-flash (Tools)</text>

    <line x1="18" y1="102" x2="242" y2="102" stroke="#3E2C22" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="3" fill="#FB923C" />
      <text x="14" y="10" class="body-text">In-flight semantic classification</text>
      <text x="14" y="26" class="body-text">into structured function schemas:</text>

      <!-- Code Chips -->
      <rect x="14" y="40" width="210" height="22" rx="4" fill="#2E1C14" stroke="#4A2E20" />
      <text x="22" y="55" class="model-tag" fill="#FED7AA">• draw_picture(prompt)</text>

      <rect x="14" y="68" width="210" height="22" rx="4" fill="#2E1C14" stroke="#4A2E20" />
      <text x="22" y="83" class="model-tag" fill="#FED7AA">• edit_current_image(delta)</text>

      <rect x="14" y="96" width="210" height="22" rx="4" fill="#2E1C14" stroke="#4A2E20" />
      <text x="22" y="111" class="model-tag" fill="#FED7AA">• animate_artwork(motion)</text>

      <circle cx="4" cy="140" r="3" fill="#FB923C" />
      <text x="14" y="144" class="body-text">Zero complex prompt chains</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="224" height="36" rx="8" fill="#140E0A" stroke="#3E2C22" />
    <text x="30" y="347" class="badge-text" fill="#A8A29E">ROUTING</text>
    <text x="230" y="347" text-anchor="end" class="badge-text" fill="#FDBA74">Single Forward Pass</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 620 340 L 655 340" stroke="#FB923C" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowWarm)" />

  <!-- CARD 3: Visual Sculpting (Coral Rose) -->
  <g transform="translate(660, 150)" filter="url(#dropShadow)">
    <rect width="260" height="380" rx="18" fill="url(#warmCardBg)" stroke="#3E2C22" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="5" rx="2.5" fill="#F43F5E" />

    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#F43F5E" fill-opacity="0.2" stroke="#F43F5E" stroke-opacity="0.5" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#FB7185">STAGE 03</text>
    
    <text x="225" y="34" font-size="18">🎨</text>

    <text x="18" y="68" class="card-title">Visual In-Painting</text>
    <text x="18" y="88" class="model-tag" fill="#FB7185">gemini-3.1-flash-image</text>

    <line x1="18" y1="102" x2="242" y2="102" stroke="#3E2C22" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="3" fill="#F43F5E" />
      <text x="14" y="10" class="body-text">16:9 Widescreen canvas image</text>
      <text x="14" y="26" class="body-text">generation aligned to viewport</text>

      <circle cx="4" cy="52" r="3" fill="#F43F5E" />
      <text x="14" y="56" class="body-text"><tspan font-weight="700" fill="#FFFBEB">Conversational In-Painting:</tspan></text>
      <text x="14" y="72" class="body-text">Passes active canvas pixels +</text>
      <text x="14" y="88" class="body-text">spoken delta instructions</text>

      <circle cx="4" cy="114" r="3" fill="#F43F5E" />
      <text x="14" y="118" class="body-text">Preserves character identity,</text>
      <text x="14" y="134" class="body-text">scene lighting, and environment</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="224" height="36" rx="8" fill="#140E0A" stroke="#3E2C22" />
    <text x="30" y="347" class="badge-text" fill="#A8A29E">CANVAS</text>
    <text x="230" y="347" text-anchor="end" class="badge-text" fill="#FB7185">16:9 Cinema</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 925 340 L 960 340" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowRose)" />

  <!-- CARD 4: Omni 1.1 Flash Video & Native Audio (Sunset Crimson) -->
  <g transform="translate(965, 150)" filter="url(#dropShadow)">
    <rect width="225" height="380" rx="18" fill="url(#warmCardBg)" stroke="#BE123C" stroke-width="2" />
    <rect x="0" y="0" width="225" height="5" rx="2.5" fill="#E11D48" />

    <!-- Header -->
    <rect x="18" y="18" width="70" height="22" rx="4" fill="#E11D48" fill-opacity="0.25" stroke="#E11D48" stroke-opacity="0.6" />
    <text x="53" y="33" text-anchor="middle" class="badge-text" fill="#FDA4AF">STAGE 04</text>
    
    <text x="190" y="34" font-size="18">✨</text>

    <text x="18" y="68" class="card-title">Video &amp; Sound</text>
    <text x="18" y="88" class="model-tag" fill="#FDA4AF">Omni 1.1 Flash</text>

    <line x1="18" y1="102" x2="207" y2="102" stroke="#3E2C22" />

    <!-- Bullet Points -->
    <g transform="translate(18, 120)">
      <circle cx="4" cy="6" r="3" fill="#E11D48" />
      <text x="14" y="10" class="body-text"><tspan font-weight="700" fill="#FFFBEB">Gemini Omni 1.1 Flash:</tspan></text>
      <text x="14" y="26" class="body-text">720p 24fps physical simulation</text>

      <circle cx="4" cy="52" r="3" fill="#E11D48" />
      <text x="14" y="56" class="body-text"><tspan font-weight="700" fill="#FFFBEB">Native Audio Synthesis:</tspan></text>
      <text x="14" y="72" class="body-text">48kHz stereo AAC sound</text>
      <text x="14" y="88" class="body-text">synchronized to visual motion</text>

      <circle cx="4" cy="114" r="3" fill="#E11D48" />
      <text x="14" y="118" class="body-text"><tspan font-weight="700" fill="#FFFBEB">FFmpeg Mastering:</tspan> +8dB</text>
      <text x="14" y="134" class="body-text">to -13 LUFS broadcast audio</text>
    </g>

    <!-- Card Footer Metric -->
    <rect x="18" y="325" width="189" height="36" rx="8" fill="#140E0A" stroke="#3E2C22" />
    <text x="28" y="347" class="badge-text" fill="#A8A29E">OUTPUT</text>
    <text x="195" y="347" text-anchor="end" class="badge-text" fill="#FDA4AF">720p · 48kHz</text>
  </g>

  <!-- ================= BOTTOM DATA FLOW BAR ================= -->
  <g transform="translate(50, 560)">
    <rect width="1140" height="90" rx="16" fill="#1C1410" stroke="#3E2C22" stroke-width="1.5" />

    <circle cx="30" cy="45" r="5" fill="#F59E0B" />
    
    <text x="45" y="38" class="badge-text" fill="#A8A29E">CLOSED-LOOP MULTIMODAL DIRECTING CYCLE</text>
    <text x="45" y="60" class="body-text" font-size="13">
      Microphone ➔ <tspan fill="#FBBF24" font-weight="700">Gemini 3.5 Transcribe</tspan> ➔ <tspan fill="#FDBA74" font-weight="700">Gemini 3.7 Router</tspan> ➔ <tspan fill="#FB7185" font-weight="700">3.1 Flash In-Painting</tspan> ➔ <tspan fill="#FDA4AF" font-weight="800">Gemini Omni 1.1 Flash (Video + Sound)</tspan> ➔ <tspan fill="#FDE68A" font-weight="700">Unmuted Playback</tspan>
    </text>

    <!-- Right Badges -->
    <g transform="translate(900, 28)">
      <rect x="0" y="0" width="110" height="34" rx="8" fill="#261B16" stroke="#4A3427" />
      <text x="55" y="21" text-anchor="middle" class="badge-text" fill="#FBBF24">ADC AUTH</text>

      <rect x="120" y="0" width="110" height="34" rx="8" fill="#261B16" stroke="#4A3427" />
      <text x="175" y="21" text-anchor="middle" class="badge-text" fill="#FB7185">OMNI 1.1 FLASH</text>
    </g>
  </g>

</svg>
