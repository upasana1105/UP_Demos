<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio — Voice Canvas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/style.css?v=7.0">
</head>
<body class="h-screen max-h-screen flex flex-col justify-between items-center py-3 px-4 select-none overflow-hidden bg-[#F5F5F7]">

  <!-- Apple Minimalist Top Bar -->
  <header class="w-full max-w-2xl flex items-center justify-between px-2">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-stone-900 flex items-center justify-center shadow-xs">
        <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
      </div>
      <div class="flex items-center gap-2">
        <h1 class="text-xs font-semibold tracking-[0.18em] uppercase text-stone-900">STUDIO</h1>
        <span class="text-stone-300">/</span>
        <span class="text-xs text-stone-500 font-light tracking-tight">Voice Atelier</span>
      </div>
    </div>

    <!-- Right: Model Pill & Clear -->
    <div class="flex items-center gap-2">
      <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/70 border border-stone-200/60 shadow-xs text-[10px] text-stone-500 font-mono-meta">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Gemini 3.5 · 3.1 Flash · Omni 1.1</span>
      </div>
      <button id="clearCanvasBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white hover:bg-stone-100 text-stone-600 hover:text-stone-900 text-xs font-medium border border-stone-200/70 shadow-xs transition-all cursor-pointer">
        <svg class="w-3 h-3 text-stone-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>Clear</span>
      </button>
    </div>
  </header>

  <!-- Central Canvas -->
  <main class="w-full max-w-2xl flex flex-col items-center gap-2.5 flex-1 justify-center px-4">
    
    <!-- The Master Artwork Canvas Frame (Cinematic 16:9 Widescreen) -->
    <div class="relative w-full max-w-[620px] aspect-[16/9] rounded-[28px] canvas-frame overflow-hidden flex items-center justify-center p-2 group bg-white shadow-2xl">
      
      <!-- 1. BLANK CANVAS STATE (Clean Professional Canvas) -->
      <div id="blankCanvasState" class="absolute inset-0 w-full h-full blank-canvas-texture flex flex-col items-center justify-center transition-all duration-700">
        
        <!-- Subtle Precision Corner Reticles -->
        <div class="absolute top-5 left-5 w-4 h-4 border-t border-l border-stone-300/80"></div>
        <div class="absolute top-5 right-5 w-4 h-4 border-t border-r border-stone-300/80"></div>
        <div class="absolute bottom-5 left-5 w-4 h-4 border-b border-l border-stone-300/80"></div>
        <div class="absolute bottom-5 right-5 w-4 h-4 border-b border-r border-stone-300/80"></div>

        <!-- Minimal Optical Center Reticle -->
        <div class="w-8 h-8 rounded-full border border-stone-200/60 flex items-center justify-center opacity-60">
          <div class="w-1.5 h-1.5 rounded-full bg-stone-300"></div>
        </div>
      </div>

      <!-- 2. ACTIVE ARTWORK IMAGE DISPLAY -->
      <div id="activeArtworkContainer" class="hidden w-full h-full rounded-[24px] overflow-hidden relative">
        <img id="canvasImage" src="" alt="Artwork" class="w-full h-full object-cover rounded-[24px] transition-all duration-700">
        
        <!-- Animated Video from Gemini Omni Flash -->
        <video id="canvasVideo" class="hidden absolute inset-0 w-full h-full object-cover rounded-[24px] cursor-pointer" loop playsinline></video>

        <!-- Prominent Floating Unmute Button -->
        <button id="unmuteOverlayBtn" class="hidden absolute bottom-4 right-4 px-3.5 py-2 rounded-full bg-stone-900/90 hover:bg-stone-950 text-white text-xs font-medium flex items-center gap-2 shadow-xl backdrop-blur-md transition-all cursor-pointer z-10 animate-bounce" title="Click to unmute video audio">
          <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          <span id="unmuteOverlayLabel">🔊 Click for Sound</span>
        </button>

        <!-- Comparison overlay -->
        <img id="compareImage" src="" alt="Original" class="hidden absolute inset-0 w-full h-full object-cover rounded-[24px]">

        <!-- Top Right Actions: Omni Animate, View Toggle, Compare, Download -->
        <div class="absolute top-3 right-3 flex items-center gap-2 z-10">
          
          <!-- Toggle between Still and Video when video exists -->
          <button id="viewToggleBtn" class="hidden text-xs px-2.5 py-1.5 rounded-full glass-chip text-stone-800 font-medium flex items-center gap-1 shadow-sm transition-all cursor-pointer">
            <span id="viewToggleLabel">View Still</span>
          </button>

          <!-- Toggle Sound for Omni Video -->
          <button id="soundToggleBtn" class="hidden text-xs px-2.5 py-1.5 rounded-full glass-chip text-stone-800 font-medium flex items-center gap-1.5 shadow-sm transition-all cursor-pointer" title="Toggle Video Audio">
            <span id="soundIcon">
              <svg class="w-3.5 h-3.5 text-stone-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </span>
            <span id="soundToggleLabel">Sound On</span>
          </button>

          <!-- Compare Before/After Toggle -->
          <button id="compareToggleBtn" class="hidden text-xs px-3 py-1.5 rounded-full glass-chip text-stone-800 font-medium flex items-center gap-1.5 shadow-sm">
            <svg class="w-3.5 h-3.5 text-stone-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 3h5v5"/>
              <path d="M8 3H3v5"/>
              <path d="M12 22v-8"/>
              <path d="m9 17 3-3 3 3"/>
            </svg>
            <span id="compareToggleLabel">Show Original</span>
          </button>
          
          <a id="downloadBtn" href="#" download="studio_art.png" class="p-2 rounded-full glass-chip text-stone-800 hover:text-stone-950 transition-colors shadow-sm" title="Download Asset">
            <svg class="w-3.5 h-3.5 text-stone-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- 3. PAINTING OVERLAY -->
      <div id="canvasPaintingOverlay" class="hidden absolute inset-0 bg-white/90 backdrop-blur-md flex flex-col items-center justify-center p-6 gap-3 z-20">
        <div class="scanner-sweep"></div>
        <div class="w-12 h-12 rounded-full border-2 border-stone-200 border-t-amber-500 animate-spin"></div>
        <div class="text-center space-y-1">
          <h3 id="paintingStatusTitle" class="text-xs font-semibold text-stone-900 tracking-wide">
            Sculpting with Gemini...
          </h3>
          <p id="paintingStatusSubtitle" class="text-[11px] text-stone-500 font-light">
            Translating spoken frequency into optical pixels
          </p>
        </div>
        <div class="w-44 h-1 bg-stone-100 rounded-full overflow-hidden mt-1">
          <div id="canvasProgressBar" class="h-full bg-gradient-to-r from-amber-500 to-amber-600 rounded-full transition-all duration-300" style="width: 30%"></div>
        </div>
      </div>

    </div>

    <!-- Quota Alert Notice (Appears transparently when GCP Quota limit is reached) -->
    <div id="quotaAlertBanner" class="hidden w-full max-w-[620px] px-3.5 py-2 rounded-xl bg-amber-50/95 border border-amber-200 text-amber-900 text-xs flex items-center justify-between gap-2 shadow-xs transition-all">
      <div class="flex items-center gap-2">
        <svg class="w-3.5 h-3.5 text-amber-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="quotaAlertMsg" class="font-normal text-[11px] leading-tight"></span>
      </div>
      <button id="dismissQuotaBtn" class="text-amber-500 hover:text-amber-800 text-sm cursor-pointer ml-1">×</button>
    </div>

    <!-- Spoken Words Transcription Display (Directly Below Canvas) -->
    <div id="captionContainer" class="w-full max-w-[520px] text-center min-h-[44px] flex items-center justify-center px-4">
      <p id="captionText" class="font-serif-quote italic text-base md:text-lg text-stone-800 leading-snug tracking-tight transition-all"></p>
    </div>

  </main>

  <!-- Focused Apple Voice Controller (Single Hero Milled Acoustic Instrument) -->
  <footer class="w-full max-w-xl flex flex-col items-center gap-2 pb-2">
    
    <div class="flex flex-col items-center gap-2">
      
      <!-- The Apple Dictation Button -->
      <div class="relative flex items-center justify-center">
        <!-- Ambient Pulse ring when listening -->
        <div id="micPulseRing" class="hidden absolute -inset-3 rounded-full bg-amber-400/25 animate-ping"></div>
        
        <button id="masterMicBtn" class="acoustic-btn relative px-8 py-3.5 rounded-full text-white flex items-center gap-3 cursor-pointer">
          <!-- Inline Microphone SVG -->
          <span id="micIconContainer" class="flex items-center justify-center">
            <svg id="micIconSvg" class="w-5 h-5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </span>
          <span id="micButtonLabel" class="text-sm font-semibold tracking-tight text-white">Tap to Speak</span>
        </button>
      </div>

      <!-- Clear Status Label -->
      <div class="text-center">
        <span id="micStatusText" class="text-xs font-light text-stone-500 tracking-tight block">
          Speak your idea, then press the button to sculpt
        </span>
      </div>

      <!-- Real-Time Waveform (Active when speaking) -->
      <div id="waveContainer" class="hidden w-52 h-8 items-center justify-center overflow-hidden">
        <canvas id="liveWaveCanvas" class="w-full h-full"></canvas>
      </div>

    </div>

  </footer>

  <!-- Scripts -->
  <script src="/static/app.js?v=22.0"></script>
</body>
</html>
